name: Build unsigned IPA (iOS 15.4 port)

# 构建 OpenMinis 的 iOS 15.4 降级移植版，产出未签名 IPA。
#
# 为什么需要这个流水线：iOS 工程必须用 macOS + Xcode 构建，并且本项目
# 的 iSH 内核 / FFmpeg / LAME / rclone / Alpine rootfs 全部从源码编译，
# 无法在 Windows 上完成。
#
# 产出物是一个 **未签名** IPA，需要用 TrollStore 或自签工具（AltStore /
# Sideloadly）安装到设备上。

on:
  push:
    branches: [legacy-ios15]
  workflow_dispatch:
    inputs:
      runner:
        description: '构建机镜像（若 iOS 26 SDK 为必需，改用 macos-26）'
        required: false
        default: 'macos-15'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 350

    steps:
      - name: 检出源码（含子模块 iSH / PRoot）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 Go 1.25（rclone 需要）
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 打印工具链版本
        run: |
          set -x
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          go version
          python3 --version
          xcodebuild -showsdks | grep -i ios || true

      - name: 安装构建依赖
        run: |
          brew install ninja llvm libarchive pkg-config
          python3 -m pip install --break-system-packages meson || python3 -m pip install meson

      - name: 下载 Metal Toolchain（FFmpeg 的 yadif_videotoolbox 滤镜用，缺失不致命）
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain 下载失败，继续（FFmpeg 会静默丢弃该滤镜）"

      - name: 生成构建期配置文件
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          echo "已生成 ProviderCustomization.xcconfig（值留空，应用可正常编译运行）"

      - name: 构建 LAME（FFmpeg 依赖，必须先于 FFmpeg）
        run: ./deps/build_lame.sh

      - name: 构建 FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: 构建 iSH 内核
        run: ./deps/build_ish.sh

      - name: 准备 Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: 构建 rclone
        run: ./deps/build_rclone_ios.sh

      - name: 校验原生依赖产物
        run: |
          set -e
          test -f deps/lame-build/lib/libmp3lame.a && echo "OK libmp3lame.a"
          ls deps/frameworks | head -20
          ls deps/libs | head -20
          test -d deps/frameworks/Rclone.xcframework && echo "OK Rclone.xcframework"

      - name: 构建 App（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.4 \
            build 2>&1 | tee xcodebuild.log

      - name: 校验产物与最低系统版本
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          echo "--- Info.plist 关键项 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          echo "--- 主二进制 LC_BUILD_VERSION minos ---"
          otool -l "$APP/Minis" | grep -A4 LC_BUILD_VERSION | head -12
          echo "--- 内嵌扩展 ---"
          ls "$APP/PlugIns" 2>/dev/null || true

      - name: 打包成 IPA
        run: |
          set -e
          rm -rf out && mkdir -p out/Payload
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "Minis-ios15.4-unsigned.ipa" Payload
          ls -lh Minis-ios15.4-unsigned.ipa
          unzip -l Minis-ios15.4-unsigned.ipa | head -5

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ios15.4-unsigned-ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: 发布 Release（便于直接下载 IPA）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios15.4-b${{ github.run_number }}" out/*.ipa \
            --title "OpenMinis iOS 15.4 移植版 build ${{ github.run_number }}" \
            --notes "OpenMinis 的 iOS 15.4 降级移植版（未签名 IPA）。

          - 最低系统版本：iOS 15.4
          - 安装方式：TrollStore / 自签工具
          - 构建提交：${{ github.sha }}
          - 上游项目：https://github.com/OpenMinis/OpenMinis （GPLv3）"

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
          if-no-files-found: ignore
